<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Report</title>
<meta name="description" content="Website Report · VietNamNet">
<meta name="theme-color" content="#1fa35a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Web Report">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f5f7fb}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#475467;font-size:14px;transition:opacity .3s}
  #splash img{width:84px;height:84px;border-radius:20px;box-shadow:0 8px 24px rgba(31,163,90,.25)}
  #splash .bar{width:120px;height:4px;border-radius:2px;background:#e4e8ee;overflow:hidden}
  #splash .bar i{display:block;width:40%;height:100%;background:#1fa35a;animation:mv 1.1s infinite ease-in-out}
  @keyframes mv{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  #help{display:none;margin-top:6px;text-align:center;max-width:320px;line-height:1.5}
  #help a{color:#1fa35a;font-weight:600}
  .hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div><b>Website Report</b></div>
  <div class="bar"><i></i></div>
  <div id="help">Nếu trang chưa hiện, có thể trình duyệt cần đăng nhập Google.<br><a id="open" href="#" target="_blank" rel="noopener">Mở Website Report</a></div>
</div>
<iframe id="app" title="Website Report" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  // Link web app gốc (Apps Script). Đổi link ở đây nếu deployment đổi.
  var APP = 'https://script.google.com/a/macros/vietnamnet.vn/s/AKfycbzk3GrrXnqSSdQj_UAfyj5qIebNUZXvUGyetaZdKz7L07Lwe0BPBwimOm0v6GH9rff-/exec';
  var qs = location.search || '';
  var url = APP + qs;               // giữ tham số ?mod=… ?tb=… nếu có
  document.getElementById('open').href = url;
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    // Safari chặn cookie đăng nhập Google trong khung nhúng → mở thẳng trang
    location.replace(url);
  } else {
    var f = document.getElementById('app'), s = document.getElementById('splash');
    f.onload = function () { s.classList.add('hide'); };
    f.src = url;
    setTimeout(function () { document.getElementById('help').style.display = 'block'; }, 12000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
